  assemblies:
  - SharpValhalla
  namespace: SharpValhalla.Enums
  summary: Standard costing for driving routes by car, motorcycle, truck, and so on that obeys automobile driving rules, such as access and turn restrictions. Auto provides a short time path (though not guaranteed to be shortest time) and uses intersection costing to minimize turns and maneuvers or road name changes. Routes also tend to favor highways and higher classification roads, such as motorways and trunks.
  example: []
  syntax:
    content: Auto = 0
    return:
      type: SharpValhalla.Enums.CostingModel
