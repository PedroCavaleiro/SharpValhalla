  - SharpValhalla
  namespace: SharpValhalla.Enums
  summary: Standard costing for travel by motor scooter or moped. By default, motor_scooter costing will avoid higher class roads unless the country overrides allows motor scooters on these roads. Motor scooter routes follow regular roads when needed, but avoid roads without motor_scooter, moped, or mofa access.
  example: []
  syntax:
    content: MotorScooter = 8
    return:
      type: SharpValhalla.Enums.CostingModel
