  syntax:
    content: public MapMatchingRequest(List<Location>? shape = null, string? encodedPolyline = null, ShapeMatch shapeMatch = ShapeMatch.WalkOrSnap, CostingModel costing = CostingModel.Auto, bool useTimestamps = false, DirectionsOptions? directionsOptions = null, TraceOptions? traceOptions = null, int? beginTime = null, List<int>? durations = null, TraceAttributesFilter? filters = null)
    parameters:
    - id: shape
      type: System.Collections.Generic.List{SharpValhalla.Models.Common.Location}
      description: The shape to match
    - id: encodedPolyline
      type: System.String
      description: The polyline to match
    - id: shapeMatch
      type: SharpValhalla.Enums.ShapeMatch
      description: Allows some control of the matching algorithm based on the type of input.
    - id: costing
      type: SharpValhalla.Enums.CostingModel
      description: Valhalla Map Matching can use any costing model available in the Valhalla route service
    - id: useTimestamps
      type: System.Boolean
      description: A boolean value indicating whether the input timestamps or durations should be used when computing elapsed time at each edge along the matched path. If true, timestamps are used. If false (default), internal costing is applied to compute elapsed times.
    - id: directionsOptions
      type: SharpValhalla.Models.Request.DirectionsOptions
      description: Specify units, language, and whether or not to return directions in a narrative form.
    - id: traceOptions
      type: SharpValhalla.Models.Request.TraceOptions
      description: Trace options to improve results
    - id: beginTime
      type: System.Nullable{System.Int32}
      description: Begin timestamp for the trace. This is used along with the durations so that timestamps can be specified for a trace that is specified using an encoded polyline.
    - id: durations
      type: System.Collections.Generic.List{System.Int32}
      description: List of durations (seconds) between each successive pair of input trace points. This allows trace points to be supplied as an encoded polyline and timestamps to be created by using this list of "delta" times along with the beginTime of the trace.
    - id: filters
      type: SharpValhalla.Models.Request.TraceAttributesFilter
      description: The trace attributes filters for this request
