  assemblies:
  - SharpValhalla
  namespace: SharpValhalla.Utils
  summary: >-
    Decodes a Valhalla/Google-style polyline-encoded string into an array of geographic coordinates.

    This was converted from the Python sample in the valhalla docs: https://valhalla.github.io/valhalla/decoding/#python
  example: []
  syntax:
    content: public static List<LocationCoordinate2D> DecodePolylineShape(string encoded, double precision = 1E-06)
    parameters:
    - id: encoded
      type: System.String
      description: The encoded polyline string to decode.
    - id: precision
      type: System.Double
      description: The scaling factor used when encoding coordinates. Defaults to 1e-6.
    return:
      type: System.Collections.Generic.List{SharpValhalla.Models.Common.LocationCoordinate2D}
      description: An array of LocationCoordinate2D objects representing the decoded path.
    content.vb: Public Shared Function DecodePolylineShape(encoded As String, precision As Double = 1E-06) As List(Of LocationCoordinate2D)
